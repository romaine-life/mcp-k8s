# ============================================================================
# mcp-k8s values
# ============================================================================
# No KV creds. The pod authenticates to the K8s API via its automounted SA
# token; the SA is bound to a custom cluster-wide read ClusterRole (see
# templates/cluster-reader.yaml). The kubectl + helm binaries pick up
# that token from the standard in-cluster paths automatically.

image:
  repository: romainecr.azurecr.io/mcp-k8s
  # SHA-pinned. .github/workflows/build.yml rewrites this tag on every push to main
  # via a `[skip ci]` follow-up commit. Quoted so all-digit short-SHAs don't
  # become floats — see reference_yaml_tag_quoting.md.
  tag: "0817f78"
  pullPolicy: IfNotPresent

# Loopback-only port the Python uvicorn server listens on.
upstreamPort: 8080

proxy:
  image:
    repository: quay.io/brancz/kube-rbac-proxy
    tag: v0.18.2
    pullPolicy: IfNotPresent
  port: 8443

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

proxyResources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
